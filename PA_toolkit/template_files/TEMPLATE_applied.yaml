methods:
  - "**MO research scoped** from the supplied bibliography (Hemming ResearchGate profile, 127 publications), filtering to plant pest/pathogen/biosecurity and adjacent vector work; the tool was characterised by inspecting the web app and its specific-pests reference list (PDF), confirming it as a degree-day thermal-accumulation model."
  - "**Partnership and research-to-policy channels** confirmed via the Met Office blog (21 Mar 2024) and Defra\u2019s UK Plant Health Information Portal (contingency-planning and strategy pages, accessed June 2026), plus GOV.UK APHA surveillance guidance."
  - "**Policy candidates** drawn from the governance workbook\u2019s Policies & Activities sheet (uk_climate_nature_governance; the POL records scored are stable across v8\u2013v15), filtered first on the Biosecurity / Nature / Land sector tags, then all records screened for a plausible pest/pathogen/tree-health dependency; supplemented with operational activities (risk register, contingency plans, Observatree) absent from the workbook."
  - "**Scoring** used two independent axes. *Relevance* (materiality of MO pest science to the policy): direct/named input = 3; defined risk-or-adaptation evidence role = 2; implicit dependency = 1. *Status*: Current where MO science already informs the activity (documented), Opportunity where the use is credible but not yet realised. Kept separate so a high-materiality policy not yet using the science (e.g. CCRA4, EIP 2025) is not mistaken for a low-relevance one."
  - "**Indicator scan** of biodiversity_indicators_manual_v6 across its framework sheets, keyword-filtered for invasive/non-native species, plant pests and pathogens, tree health and phenology, then narrowed to indicators whose measured quantity MO outputs could directly inform (distribution/establishment modelling, crop-pest phenology, the temperature-driven Spring Index)."

gaps: "The workbook holds no records for the GB Plant Health Risk Register, contingency plans or Observatree \u2014 these are the highest-relevance operational activities and are arguably worth adding as POL records. Relevance for the carbon / biomass / land-use policies is inference, not evidenced in current policy text. The tool covers a small predefined pest set; pathogen (versus insect) coverage is thinner, so pathogen-heavy policies (e.g. *Phytophthora*, *Xylella*) are served more by the microclimate work than by the public tool."

