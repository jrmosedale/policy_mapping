methods:
  - "**Capability scoped from external evidence**, not from MO outputs: the supplied bibliography is an extreme-LST topic reading list, used to establish what LST applications are demonstrated elsewhere and how mature each is for UK policy use."
  - "**MO/ESA capability characterised** by inspecting MO and ESA pages (accessed June 2026): the ESA CCI LST_cci project (Met Office climate-services / CMUG partner), UKCP18 urban-resolving projections, the State of the UK Climate (NCIC) monitoring and attribution, and the Urban Climate Services team."
  - "**Policy candidates** drawn from a full sweep of the governance workbook\u2019s Policies & Activities sheet (uk_climate_nature_governance_v15, 64 records; POL IDs stable across versions): screened across the Climate, Urban & Buildings, Health, Nature, Land and Water sectors for a plausible surface-temperature dependency. Supplemented with operational heat activities absent from the workbook \u2014 the Weather-Health Alerting System, the Adverse Weather and Health Plan, NSWWS Extreme Heat warnings and Building Regulations Part O \u2014 marked †. Marine (sea-surface-temperature) records were excluded as out of scope for a land product."
  - "**Scoring** used two independent axes. *Relevance* (materiality of a UK LST product to the policy): central input = 3; supporting evidence layer = 2; marginal/indirect = 1. *Maturity*: Demonstrated where the application is proven elsewhere and transferable; Emerging where partial evidence needs UK development; Conceptual where the use is plausible but unproven. Kept separate so a high-value-but-immature application is not mistaken for a low-relevance one."
  - "**Indicator scan** of indicators_climate_nature.xlsx across its framework sheets, keyword-filtered for heat, surface/skin temperature and drought, then narrowed to indicators whose measured quantity an LST product could directly inform (surface-temperature extremes, evaporative stress / drought); urban tree-cover indicators were excluded because their measured quantity (a GIS area) takes no climate input. A focused web scan for authoritative indicators absent from the workbook found the UKHSA Heat mortality monitoring report (Official Statistic; overlaps CCC IND-C-130), marked †. Throughout, satellite LST (skin temperature) was treated as distinct from near-surface air temperature."

gaps: "Two structural caveats. First, the bibliography is an external extreme-LST reading list, not an MO publication list, so MO capability was scoped from MO/ESA sources rather than the file. Second, satellite LST and near-surface air temperature are distinct: most UK heat policy runs on air temperature, so direct LST uptake is currently thin and most LST links here are Emerging or Conceptual. Four of the highest-relevance heat activities are operational processes not held in the governance workbook \u2014 the Weather-Health Alerting System, the Adverse Weather and Health Plan, NSWWS Extreme Heat warnings and Building Regulations Part O (marked †) \u2014 and are arguably worth adding as records. The Part O link runs via CIBSE weather files (inferred, medium confidence); the NPPF, NCEA and Clean Air links are credible but not yet evidenced in current policy text. Sea-surface-temperature and marine-heatwave uses were excluded as out of scope for a land product."

