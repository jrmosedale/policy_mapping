scoring:
  relevance: {3: "High", 2: "Medium", 1: "Low"}
  status_values: ["Demonstrated", "Emerging", "Conceptual"]
  legend: >-
    Two independent axes. **Relevance** (materiality of a UK LST product to the policy): **3 High** =
    would be a direct, central input; **2 Medium** = a useful supporting evidence layer; **1 Low** =
    marginal or indirect. **Maturity** (how proven the application is): Demonstrated = proven elsewhere
    and transferable; Emerging = partial evidence, needs UK development/validation; Conceptual =
    plausible but unproven for this use. Items marked † are activities not held in the governance
    workbook. Policy names link to the source page.

key_points:
  - "**This product does not yet exist at the Met Office.** This is a gap assessment: the external literature shows land surface temperature (LST) is used effectively elsewhere (urban heat islands, tree-canopy cooling, drought/evapotranspiration), and this asks what UK policy could do with a comparable MO product."
  - "**Key distinction:** satellite *LST* (skin temperature) is not *near-surface air temperature*. Almost all current UK heat policy \u2014 Heat-Health Alerts, overheating standards, CCRA/NAP heat risks \u2014 runs on air temperature, so direct LST uptake today is thin. That is precisely the gap."
  - "**Highest-value prospective applications (Relevance 3):** intra-urban heat-exposure mapping for the Weather-Health Alerting System and Adverse Weather and Health Plan, for CCRA4 / NAP4, and for planning under the NPPF (overheating, urban heat islands, green-infrastructure siting)."
  - "**Timely:** UKHSA and the Met Office are already moving the Weather-Health Alerts toward finer geographic resolution \u2014 the natural insertion point for an intra-urban LST exposure layer."
  - "**Maturity varies:** urban green-infrastructure cooling is **Demonstrated** (tree-canopy LST studies); most heat and drought applications are **Emerging** (proven in research, not yet in UK policy); planning, overheating standards and ecosystem-condition uses are **Conceptual**."
  - "**Caveats:** the supplied bibliography is an extreme-LST topic reading list, not an MO publication list, so MO capability was scoped from MO/ESA sources; and four of the highest-relevance heat activities are operational processes not held in the governance workbook (marked †)."

summary:
  intro: "A UK LST product would deliver satellite-derived skin-temperature fields at fine spatial resolution \u2014 resolving intra-urban hot-spots, surface temperature extremes and surface-moisture stress in ways gridded air-temperature products cannot. The Met Office sits in a climate-services / model-evaluation role on the **ESA CCI Land Surface Temperature** record (led by the University of Leicester) and runs urban land-surface modelling (MORUSES / JULES) and Urban Climate Services. The external evidence base below shows the policy-relevant applications are established science elsewhere."
  bullets:
    - "**Urban heat island & exposure** \u2014 LST resolves within-city temperature variation that drives differential heat exposure and mortality (Zhao et al. 2021; Tuholske et al. 2021)."
    - "**Green-infrastructure cooling** \u2014 tree-canopy and green/blue space measurably lower summer LST in temperate cities, quantifiable from LST (Wang, Scott & Dallimer 2023)."
    - "**Surface temperature extremes** \u2014 LST captures land-surface maxima well above air temperature, relevant to infrastructure and ecosystem heat stress (Mildrexler et al. 2011; Garratt 1992)."
    - "**Surface moisture / drought** \u2014 LST is a proxy for evaporative stress and soil-moisture deficit during heatwaves (Aminzadeh & Or 2014)."
  closing: "A prospective MO UK LST product would translate these demonstrated capabilities into a national, policy-ready evidence layer; the table maps where that would matter and how proven each use is."

policy_rows:
  - ref: "\u2020"
    name: "Heat-Health Alerting System / Weather-Health Alerts (UKHSA \u2013 Met Office)"
    url: "https://www.gov.uk/guidance/heat-health-alerting-system"
    relevance: 3
    status: "Emerging"
    why: "Alerts run on Met Office near-surface air-temperature forecasts, not satellite LST. An LST product could add intra-urban hot-spot granularity to target interventions within alert regions \u2014 and UKHSA/Met Office are already moving toward finer-resolution alerts, the natural insertion point."
  - ref: "\u2020"
    name: "Adverse Weather and Health Plan (AWHP) (UKHSA)"
    url: "https://www.gov.uk/government/publications/adverse-weather-and-health-plan"
    relevance: 3
    status: "Emerging"
    why: "The AWHP (a NAP commitment) is underpinned by the Weather-Health Alerting System and drives local heat-health planning. LST-derived intra-urban exposure surfaces could sharpen where warm-space and vulnerable-population actions are targeted; not yet an input."
  - ref: "POL-017"
    name: "Climate Change Risk Assessment (CCRA3 2022; CCRA4 from 2026\u201327)"
    url: "https://www.gov.uk/government/publications/climate-change-risk-assessment-2022"
    relevance: 3
    status: "Emerging"
    why: "Heat risks to health, buildings and infrastructure are central CCRA risks. An LST product could quantify urban heat-island exposure for CCRA4 \u2014 a high-value, near-term insertion point \u2014 though CCRA presently uses air-temperature evidence."
  - ref: "POL-050"
    name: "National Planning Policy Framework (NPPF)"
    url: "https://www.gov.uk/government/publications/national-planning-policy-framework--2"
    relevance: 3
    status: "Emerging"
    why: "The operative instrument for overheating, urban heat islands and green-infrastructure provision in local plans and decisions. LST-derived urban-heat surfaces could underpin heat-risk and cooling policies in plan-making; demonstrated in some local plans (e.g. London), not standardised nationally."
  - ref: "POL-002"
    name: "National Adaptation Programme (NAP3) 2023\u201328"
    url: "https://www.gov.uk/government/publications/third-national-adaptation-programme-nap3"
    relevance: 2
    status: "Emerging"
    why: "Translating CCRA heat risks into action would benefit from spatially explicit surface-heat exposure to prioritise cooling and overheating measures; the LST evidence exists but is not yet a NAP input."
  - ref: "POL-001"
    name: "Environmental Improvement Plan 2025 (urban cooling / green infrastructure)"
    url: "https://www.gov.uk/government/publications/environmental-improvement-plan"
    relevance: 2
    status: "Demonstrated"
    why: "Green-infrastructure cooling is the best-demonstrated LST application: canopy and green/blue space measurably reduce surface temperature. An LST product would provide the national evidence layer for urban greening and cooling targets."
  - ref: "POL-010"
    name: "England Peat Action Plan 2021"
    url: "https://www.gov.uk/government/publications/england-peat-action-plan"
    relevance: 2
    status: "Emerging"
    why: "Peat surface temperature and moisture are proxies for condition, dryness and wildfire/burning risk on protected peatland. LST from thermal remote sensing is an emerging monitoring input for restoration targeting and burning-ban compliance."
  - ref: "\u2020"
    name: "Building Regulations Part O (overheating in new residential buildings)"
    url: "https://www.gov.uk/government/publications/overheating-approved-document-o"
    relevance: 2
    status: "Conceptual"
    why: "Part O assessments run on CIBSE design summer-year weather files (air temperature). An LST product could inform location-specific urban-heat uplift to those files \u2014 an inferred, not-yet-established pathway."
  - ref: "\u2020"
    name: "NSWWS Extreme Heat warnings (Met Office)"
    url: "https://weather.metoffice.gov.uk/guides/warnings"
    relevance: 2
    status: "Conceptual"
    why: "Extreme-heat warnings are air-temperature and impact based; LST could add surface-heat context for built-up areas, but this is a speculative enhancement rather than a defined need."
  - ref: "POL-026"
    name: "Natural Capital & Ecosystem Assessment (NCEA) Programme"
    url: "https://www.gov.uk/government/publications/natural-capital-and-ecosystem-assessment-ncea-programme/natural-capital-and-ecosystem-assessment-ncea-programme"
    relevance: 2
    status: "Conceptual"
    why: "NCEA builds national baselines of ecosystem extent and condition. Surface temperature could feed a heat-stress condition layer for habitats and urban green space, but its use in condition accounts is not yet defined."
  - ref: "POL-009"
    name: "Land Use Framework 2025"
    url: "https://www.gov.uk/government/consultations/land-use-in-england-a-framework-for-the-future"
    relevance: 2
    status: "Conceptual"
    why: "Spatial land-use and development decisions could use LST-derived urban-heat surfaces to steer cooling-sensitive siting and green-space placement; plausible but not yet an articulated function."
  - ref: "POL-013"
    name: "Environmental Land Management schemes (drought / soil-moisture stress)"
    url: "https://www.gov.uk/government/publications/environmental-land-management-schemes-overview"
    relevance: 1
    status: "Emerging"
    why: "LST is a recognised proxy for evaporative stress and soil-moisture deficit; an LST product could support drought-sensitive land-management targeting, with research evidence but no current scheme use."
  - ref: "POL-058"
    name: "Clean Air Strategy 2019 (heat \u2013 air-quality interaction)"
    url: "https://www.gov.uk/government/publications/clean-air-strategy-2019"
    relevance: 1
    status: "Conceptual"
    why: "Urban heat and ground-level ozone episodes coincide during heatwaves; LST urban-heat surfaces could contextualise air-quality risk in cities, but the link to this strategy is indirect."

indicators_intro: "A scan of *indicators_climate_nature.xlsx* for indicators whose measured quantity a UK LST product could directly inform \u2014 surface-temperature extremes and evaporative stress / drought \u2014 complemented by a focused web scan for authoritative indicators absent from the workbook. Pure GIS-area indicators (e.g. urban tree cover) were excluded because their measured quantity takes no climate input. These are supporting evidence links, consistent with LST's Emerging maturity for most UK uses. Items marked † are not held in the indicators workbook."

