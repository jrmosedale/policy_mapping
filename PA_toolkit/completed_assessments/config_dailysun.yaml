key_points:
  - "**This is a gap assessment of a *daily* product, not of sunshine data in general.** The Met Office already produces gridded UK sunshine at 1 km, but only at *monthly* and coarser resolution in HadUK-Grid (sunshine series from 1910); of the HadUK-Grid variables, only rainfall and max/min air temperature are gridded *daily*. A near-real-time, spatially complete **daily** sunshine-duration product does not yet exist as an operational, policy-facing dataset. That is the gap."
  - "**The method already exists in-house, and a peer service already ships the product.** Good (2010) demonstrated Met Office derivation of gridded *daily* sunshine over the UK from Meteosat/SEVIRI cloud retrievals; Germany's DWD already operationalises blended station\u2013satellite gridded solar-radiation products, including a real-time one (Pfeifroth et al. 2026). A prospective UK product would operationalise the Good method \u2014 satellite-blended, daily, ~1 km, national, near-real-time \u2014 plus derived surface-solar-resource layers."
  - "**Highest-value applications are in energy.** Solar output is directly and mechanistically driven by sunshine/irradiance (Harrison 2023). A daily product would support Clean Power 2030 solar delivery (45\u201347 GW by 2030), the Solar Roadmap, generation forecasting and system balancing \u2014 a channel already live through the **Met Office\u2013NESO** collaboration."
  - "**Most mature** applications are solar delivery and system integration (Demonstrated \u2014 sunshine/irradiance resource data is already used operationally in the energy sector, and shipped as a product by DWD); **least mature** are the biodiversity links (phenology, pollinators), which are Conceptual for direct policy use."
  - "**Caveat:** the supplied bibliography is an external sunshine reading list, so Met Office capability was scoped from Met Office / CEDA sources. Where a policy link is inferred rather than documented it is marked the lower maturity value (Conceptual) and flagged."

summary:
  intro: "A prospective product would deliver **daily** satellite-blended sunshine-duration fields for the UK at ~1 km, near-real-time, with derived surface-solar-resource layers \u2014 closing the gap between the existing HadUK-Grid *monthly* sunshine grids and the *daily* cadence that energy, agriculture and biodiversity applications need. The Met Office already holds every component: the HadUK-Grid gridding pipeline (National Climate Information Centre), the Good (2010) satellite-derived *daily* sunshine method, State-of-the-UK-Climate monitoring, and an operational energy-services channel (Met Office\u2013NESO). The external evidence base below shows the policy-relevant applications are established science."
  bullets:
    - "**Solar energy conversion** \u2014 daily sunshine duration (bright hours) converts directly to daily solar power output, structured by weather type (Harrison 2023, 1908\u20132021 records)."
    - "**National met-service precedent** \u2014 Germany's DWD already operationalises gridded surface-solar-radiation products blending station and satellite data, both climate-focused (EUMETSAT CM SAF) and real-time (\u2018DUETT\u2019), all publicly available (Pfeifroth et al. 2026) \u2014 a direct precedent for the prospective UK product."
    - "**Societal value** \u2014 increased UK sunshine is linked to solar generation capacity, tourism and human well-being (Spellman 2024)."
    - "**Temperature coupling** \u2014 daily sunshine duration is strongly and significantly correlated with daily maximum temperature across European/UK stations (van den Besselaar et al. 2015), relevant to heat, growing-season and agri-productivity signals."
    - "**Record continuity** \u2014 homogenisation between Campbell\u2013Stokes and automated Kipp & Zonen sensors (Legg 2014; Kerr & Tabony 2004) is the data-quality basis any operational daily product must carry through."
  closing: "A daily product would translate these demonstrated relationships into a national, policy-ready evidence layer for solar delivery, climate-risk monitoring and \u2014 more tentatively \u2014 agri-environment and biodiversity attribution; the table maps where that would matter and how proven each use is."

policy_rows:
  - ref: "POL-005"
    name: "Clean Power 2030 Action Plan"
    url: "https://www.gov.uk/government/publications/clean-power-2030-action-plan"
    relevance: 3
    status: "Demonstrated"
    why: "Central to the plan is 45\u201347 GW of solar by 2030. Solar generation is directly weather-dependent (solar irradiance sets output). A daily, spatially complete sunshine-duration product would sharpen resource assessment, capacity-factor assumptions, generation forecasting and system integration \u2014 a use already demonstrated operationally through the Met Office\u2013NESO energy-services collaboration."
  - ref: "\u2020"
    name: "Solar Roadmap 2025 (DESNZ / Solar Taskforce / Solar Council)"
    url: "https://www.gov.uk/government/publications/solar-roadmap"
    relevance: 3
    status: "Demonstrated"
    why: "Published 30 June 2025; 72 actions to reach 45\u201347 GW, including siting, rooftop and ground-mount deployment, and agrivoltaics. Solar-resource information underpins yield estimation and well-sited deployment; industry already uses irradiance/sunshine climatologies for this, so an authoritative national daily product is a Demonstrated, transferable input. Not held as a workbook record."
  - ref: "POL-004"
    name: "UK Net Zero Strategy / Carbon Budget Delivery Plan (CBDP) 2023"
    url: "https://www.gov.uk/government/publications/net-zero-strategy"
    relevance: 2
    status: "Emerging"
    why: "Electricity-sector decarbonisation pathways rest on solar-generation projections that embed resource assumptions. A consistent daily sunshine record would improve those assumptions and the monitoring of realised solar output against the pathway \u2014 evidenced in principle, not yet an explicit CBDP input."
  - ref: "POL-016"
    name: "Contracts for Difference (CfD) scheme"
    url: "https://www.gov.uk/guidance/contracts-for-difference"
    relevance: 2
    status: "Emerging"
    why: "Over 7 GW of solar has been contracted through CfD. Strike-price setting and generation/revenue modelling for solar depend on the underlying resource; a national daily sunshine climatology would provide a consistent, official basis for yield assumptions. Currently supplied by commercial resource data rather than an MO product."
  - ref: "POL-050"
    name: "National Planning Policy Framework (NPPF) \u2014 solar-farm siting"
    url: "https://www.gov.uk/government/publications/national-planning-policy-framework--2"
    relevance: 2
    status: "Emerging"
    why: "Ground-mount solar potential is markedly higher in southern England; planning for solar farms (and the raised NSIP threshold) weighs resource against agricultural-land and landscape impacts. A national daily/aggregated sunshine-resource layer would give plan-makers a consistent siting evidence base \u2014 used informally today, not codified."
  - ref: "\u2020"
    name: "Future Homes Standard (rooftop solar on new homes, from 2027)"
    url: "https://www.gov.uk/government/consultations/the-future-homes-and-buildings-standards-2023-consultation"
    relevance: 2
    status: "Emerging"
    why: "From 2027 most new homes in England must include rooftop solar. Location-specific sunshine climatology informs realistic yield and bill-saving estimates that underpin the standard's impact assessment and household guidance. Evidenced in principle; not currently an MO product feeding the standard. Not held as a workbook record."
  - ref: "POL-017"
    name: "Climate Change Risk Assessment (CCRA3 2022; CCRA4 from 2026\u201327)"
    url: "https://www.gov.uk/government/publications/climate-change-risk-assessment-2022"
    relevance: 2
    status: "Emerging"
    why: "Solar-resource variability (energy-system risk), growing-season and agri-productivity signals, and well-being/heat all bear on CCRA risks and opportunities. Sunshine is a monitored State-of-Climate variable but not yet a discrete CCRA evidence layer; a daily product is a credible CCRA4 input."
  - ref: "POL-002"
    name: "National Adaptation Programme (NAP3) 2023\u20132028"
    url: "https://www.gov.uk/government/publications/third-national-adaptation-programme-nap3"
    relevance: 2
    status: "Emerging"
    why: "NAP delivers CCRA risks, including agriculture and energy-system resilience. Spatially explicit daily sunshine would support solar-resilience and crop-productivity actions. The link is inferred from NAP themes rather than documented, so scored the lower maturity value."
  - ref: "POL-013"
    name: "Environmental Land Management (ELM) Schemes"
    url: "https://www.gov.uk/government/publications/environmental-land-management-schemes-overview"
    relevance: 1
    status: "Conceptual"
    why: "Solar radiation / sunshine drives crop and grassland growth and is relevant to agrivoltaics (dual land use flagged in the Solar Roadmap). A daily product could inform scheme targeting and dual-use siting, but this is an inferred, not-yet-articulated pathway."
  - ref: "POL-003"
    name: "UK National Biodiversity Strategy and Action Plan (NBSAP) 2025"
    url: "https://www.gov.uk/government/publications/uk-national-biodiversity-strategy-and-action-plan"
    relevance: 1
    status: "Conceptual"
    why: "Sunshine drives phenology and the flight activity of pollinators and butterflies that underpin several biodiversity indicators. A daily sunshine product could improve attribution of biodiversity change to climate and correct survey-condition effects \u2014 credible but unproven for direct NBSAP use; inferred link."

indicators_intro: "A scan of *indicators_climate_nature.xlsx* for indicators whose measured quantity a daily sunshine-duration product could directly inform \u2014 solar-driven generation, solar-radiation-driven crop yield, and sunshine-dependent phenology and insect flight activity. Deployment counts whose measured quantity takes no climate input (e.g. installed solar PV capacity in GW) were excluded on the same basis as GIS-area indicators. Framework and application columns link to the specific report / indicator page where each is defined or used (drawn from the workbook's Source_URL column where present). Maturity for the biodiversity indicators is Conceptual for direct policy use; the energy and agriculture indicators are the more proven links."

