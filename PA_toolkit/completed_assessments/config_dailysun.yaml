    Two independent axes. **Relevance** (materiality of a daily sunshine-duration product to the policy):
    **3 High** = would be a direct, central input; **2 Medium** = a useful supporting evidence layer;
    **1 Low** = marginal or indirect. **Maturity** (how proven the application is): Demonstrated =
