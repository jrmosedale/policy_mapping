methods:
  - "**Capability scoped from external evidence and Met Office sources**, not from an MO output list: the supplied bibliography is an external UK sunshine reading list, used to establish which sunshine\u2013policy relationships are demonstrated (solar conversion, temperature coupling, societal value) and how mature each is \u2014 including a peer national-met-service precedent (DWD gridded solar-radiation products, Pfeifroth et al. 2026)."
  - "**Met Office capability characterised** by inspecting Met Office and CEDA pages (accessed July 2026): HadUK-Grid (1 km gridded sunshine, *monthly* only \u2014 daily grids exist for rainfall and temperature but not sunshine); the Good (2010) satellite-derived *daily* sunshine method; State of the UK Climate monitoring (National Climate Information Centre); and the operational Met Office\u2013NESO energy-services channel."
  - "**Policy candidates** drawn from the governance workbook's Policies & Activities sheet (uk_climate_nature_governance.xlsx, canonical; POL IDs stable across versions), filtered on Climate, Energy, Land Use & Agriculture and Nature sectors, then screened for a plausible dependency on daily sunshine / surface-solar resource; supplemented with solar activities absent from the workbook (Solar Roadmap 2025, Future Homes Standard), marked \u2020."
  - "**Scoring** used two independent axes. *Relevance* (materiality of a daily sunshine product): central input = 3; supporting evidence layer = 2; marginal/indirect = 1. *Maturity*: Demonstrated where the application is already used operationally or in industry and transferable; Emerging where partial evidence needs development for the specific policy use; Conceptual where the use is plausible but unproven. Kept separate so a high-value-but-immature application is not mistaken for a low-relevance one."
  - "**Indicator scan** of indicators_climate_nature.xlsx across its framework sheets, keyword-filtered for sunshine, solar, radiation, phenology, growing season and crop yield, then narrowed to indicators whose measured quantity a daily sunshine product could directly inform (solar generation share, crop-yield variability, phenology and insect flight activity); installed-capacity (GW) indicators were excluded because their measured quantity takes no climate input. Framework/application links use the workbook's Source_URL column where present. Sunshine duration was treated as distinct from, though correlated with, surface solar irradiance and air temperature."

gaps: "Two framing caveats. First, this assesses a prospective *daily* product: the Met Office already supplies gridded *monthly* sunshine (HadUK-Grid) and the satellite *daily* method exists (Good 2010), and a peer service (DWD) already ships an operational blended product \u2014 so the gap is operationalisation and cadence, not first-principles capability; several energy links are therefore Demonstrated rather than Conceptual. Second, sunshine duration, surface solar irradiance and air temperature are related but distinct; a policy-ready product would need to state which quantity it delivers (bright-sunshine hours vs. irradiance) because energy applications ultimately want irradiance/PV yield, for which sunshine duration is a strong but not exact proxy \u2014 the DWD experience of moving from sunshine duration to solar-radiation products is instructive here. The governance workbook holds no records for the Solar Roadmap 2025 or the Future Homes Standard \u2014 the two highest-relevance solar activities \u2014 arguably worth adding. The ELM and NBSAP links are inferred (Conceptual): sunshine matters mechanistically but is not named in current scheme or strategy text. The Future Homes Standard URL points to the consultation page; the final standard's publication URL should be substituted once confirmed."

