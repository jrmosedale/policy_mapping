  - "van den Besselaar, E.J.M. et al. (2015) Relationship between sunshine duration and temperature trends across Europe. *Journal of Geophysical Research: Atmospheres* 120(20): 10,730\u201310,739."
  - "Legg, T.P. (2014) A review of progress in establishing a consistent UK sunshine series. *Met Office Hadley Centre Climate Memorandum.*"
