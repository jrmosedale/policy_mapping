methods:
  - "**Capability scoped from external evidence**, not from MO outputs: the supplied bibliography is a marine-heatwave topic reading list, used to establish which MHW applications are demonstrated elsewhere (fisheries distribution, habitat/seagrass damage, blue-carbon and compound/sub-surface events) and how mature each is for UK policy use."
  - "**MO/partner capability characterised** by inspecting MO, Cefas, Copernicus and EEA pages (accessed July 2026): OSTIA SST analysis, the FOAM / Copernicus Marine North-West Shelf system (3D temperature), the ESA SST_cci record, MO regional coupled prediction of MHW impacts on UK weather (2024), and the Cefas–MO *40 priority questions* MHW horizon-scan (npj Ocean Sustainability 2025)."
  - "**Policy candidates** drawn from a full sweep of the governance workbook's Policies & Activities sheet (uk_climate_nature_governance v18, 64 records; POL IDs stable across versions): screened across the Marine & Fisheries, Nature, Climate, Water and Land sectors for a plausible ocean-temperature dependency. Supplemented with operational marine activities absent from the workbook — the Fisheries Act 2020 climate objective / Joint Fisheries Statement & FMPs, aquaculture food-safety (HAB/*Vibrio*) monitoring, and the UK Blue Carbon Evidence Partnership — marked †. Purely terrestrial and non-marine records were excluded as out of scope."
  - "**Scoring** used two independent axes. *Relevance* (materiality of a UK MHW product to the policy): central input = 3; supporting evidence layer = 2; marginal/indirect = 1. *Maturity*: Demonstrated where the application is proven elsewhere or already used and transferable; Emerging where partial evidence needs UK development; Conceptual where the use is plausible but unproven. Kept separate so a high-value-but-immature application (e.g. Fisheries Act/FMPs) is not mistaken for a low-relevance one."
  - "**Indicator scan** of indicators_climate_nature.xlsx across its framework sheets, keyword-filtered for marine, sea-surface/ocean temperature, heatwave and fish/plankton, then narrowed to indicators whose measured quantity an MHW product could directly inform (ocean heat/MHW intensity, temperature-driven habitat/plankton/fish-stock condition); protected-area-extent and fishing-pressure indicators were excluded because their measured quantity takes no ocean-temperature input. A focused web scan for authoritative indicators absent from the workbook found the MCCIP UK & Ireland sea-temperature evidence update (overlaps EEA IND-B-162), marked †."

gaps: "Three structural caveats. First, the bibliography is an external MHW reading list, not an MO publication list, so MO capability was scoped from MO/Cefas/Copernicus/EEA sources rather than the file. Second, the underpinning data (OSTIA, FOAM/CMEMS North-West Shelf, ESA SST_cci) already exist and MHW *monitoring* is Demonstrated; what is prospective is an **operational, categorised, forecast, policy-facing MHW product**, so most policy links here are Emerging or Conceptual rather than Current. Third, three of the highest-value marine activities are operational processes not held in the governance workbook — the Fisheries Act 2020 climate objective / Joint Fisheries Statement & FMPs, aquaculture food-safety (HAB/*Vibrio*) monitoring, and the UK Blue Carbon Evidence Partnership (marked †) — and are arguably worth adding as records. The HPMA, Marine Policy Statement/Plans, NCEA and blue-carbon links are credible but inferred, not yet evidenced in current policy text (Conceptual, lower confidence). Sub-surface and seafloor MHWs are a known monitoring gap even for the demonstrated uses."

