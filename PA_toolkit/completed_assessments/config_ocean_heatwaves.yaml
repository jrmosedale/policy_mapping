# =============================================================================
# GAP / PROSPECTIVE MODE — "if the Met Office built X, what could UK policy do with it?"
# Case: a prospective UK Marine Heatwave (ocean-heat) monitoring & forecasting product.
#
# Full sweep of uk_climate_nature_governance.xlsx (v18) Policies & Activities (64 records)
# for sea-surface / ocean-temperature dependency, plus operational marine activities absent
# from the workbook (marked †). Policy URLs taken from the workbook Link column and verified
# against source (July 2026). Second axis = MATURITY (Demonstrated / Emerging / Conceptual)
# because the product is prospective and nothing is yet "Current".
# =============================================================================

